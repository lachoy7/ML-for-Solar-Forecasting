[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-for-solar"
version = "0.1.0"
description = "Solar GHI forecasting for a Stanford Machine Learning class project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lightning>=2.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "pytorch-forecasting>=1.0",
    "requests>=2.28",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "tensorboard>=2.14",
    "tensorflow>=2.14",
    "torch>=2.0",
]

[project.optional-dependencies]
forecast = ["skforecast>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]
